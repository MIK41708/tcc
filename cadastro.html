<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Enem Breakingmizado</title>
    
    <script>
        // Aplica o tema ANTES de renderizar para evitar flash visual
        const saved = localStorage.getItem('theme');
        if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
    </script>
 
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=300;400;600;800&display=swap" rel="stylesheet">
 
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            transition: background-color 0.3s ease, color 0.3s ease;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100 min-h-screen flex flex-col justify-between">

    <div class="absolute top-6 left-6">
        <a href="/site/site.html" class="flex items-center gap-2 text-slate-600 dark:text-slate-400 hover:text-emerald-600 dark:hover:text-emerald-400 font-bold transition">
            <i data-lucide="arrow-left" class="w-5 h-5"></i>
            <span>Voltar</span>
        </a>
    </div>

    <main class="flex-grow flex items-center justify-center px-4 py-16">
        <div class="w-full max-w-md bg-white dark:bg-slate-800 p-8 rounded-[2.5rem] border-2 border-slate-200 dark:border-slate-700 shadow-xl transition-all">
            
            <div class="text-center mb-8">
                <div class="text-2xl font-extrabold tracking-tighter flex items-center justify-center gap-2 mb-2">
                    <i data-lucide="flask-conical" style="color:#059669"></i>
                    <span class="text-slate-900 dark:text-white">
                        Enem<span style="color:#059669">Breakingmizado</span>
                    </span>
                </div>
                <h2 class="text-xl font-bold text-slate-800 dark:text-slate-200">Crie sua conta de estudante</h2>
                <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Prepare-se para o ENEM jogando e aprendendo</p>
            </div>

            <form action="#" method="POST" class="space-y-5">
                
                <div>
                    <label for="name" class="block text-sm font-bold mb-1.5 text-slate-700 dark:text-slate-300">Nome Completo</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                            <i data-lucide="user" class="w-5 h-5"></i>
                        </span>
                        <input type="text" id="name" name="name" required
                            class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-700 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-emerald-500 transition-all text-sm"
                            placeholder="Seu nome completo">
                    </div>
                </div>

                <div>
                    <label for="email" class="block text-sm font-bold mb-1.5 text-slate-700 dark:text-slate-300">E-mail</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                            <i data-lucide="mail" class="w-5 h-5"></i>
                        </span>
                        <input type="email" id="email" name="email" required
                            class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-700 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-emerald-500 transition-all text-sm"
                            placeholder="seu@email.com">
                    </div>
                </div>

                <div>
                    <label for="password" class="block text-sm font-bold mb-1.5 text-slate-700 dark:text-slate-300">Senha</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                            <i data-lucide="lock" class="w-5 h-5"></i>
                        </span>
                        <input type="password" id="password" name="password" required
                            class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-700 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-emerald-500 transition-all text-sm"
                            placeholder="Crie uma senha forte">
                    </div>
                </div>

                <div>
                    <label for="password" class="block text-sm font-bold mb-1.5 text-slate-700 dark:text-slate-300">RA</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                            <i data-lucide="lock" class="w-5 h-5"></i>
                        </span>
                        <input type="password" id="password" name="password" required
                            class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-700 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-emerald-500 transition-all text-sm"
                            placeholder="Coloque seu número de RA">
                    </div>
                </div>

                <div class="flex items-start gap-2 pt-1">
                    <input type="checkbox" id="terms" name="terms" required
                        class="w-4 h-4 mt-0.5 accent-emerald-600 rounded border-slate-300 dark:border-slate-600">
                    <label for="terms" class="text-xs text-slate-600 dark:text-slate-400 font-medium">
                        Eu concordo com os Termos de Serviço e a Política de Privacidade.
                    </label>
                </div>

                <button type="submit" 
                    class="w-full bg-emerald-600 text-white py-3.5 rounded-xl font-bold hover:bg-emerald-700 active:scale-[0.98] transition-all shadow-md mt-2 flex items-center justify-center gap-2 text-base">
                    <span>Concluir Cadastro</span>
                    <i data-lucide="arrow-right" class="w-5 h-5"></i>
                </button>
            </form>

            <div class="text-center mt-6 pt-6 border-t border-slate-100 dark:border-slate-700">
                <p class="text-sm text-slate-600 dark:text-slate-400 font-medium">
                    Já tem uma conta? 
                    <a href="#" class="text-emerald-600 dark:text-emerald-400 font-bold hover:underline">Entrar na conta</a>
                </p>
            </div>

        </div>
    </main>

    <footer class="py-6 text-center text-xs text-slate-400 dark:text-slate-500 border-t border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900">
         Enem Breakingmizado - Criado pelos BGS em 2026
    </footer>

    <script>
        // Inicializa os ícones do Lucide
        lucide.createIcons();
    </script>

    <div vw class="enabled">
  <div vw-access-button class="active"></div>
  <div vw-plugin-wrapper>
    <div class="vw-plugin-top-wrapper"></div>
  </div>
</div>
<script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
<script>
  new window.VLibras.Widget('https://vlibras.gov.br/app');
</script>

</body>
</html>
